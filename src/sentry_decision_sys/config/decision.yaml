/sentry_decision_node:
  ros__parameters:
    # 话题
    nav_command_topic: "/sentry/nav_command"
    posture_command_topic: "/sentry/posture_command"
    referee_topic: "/referee_data"
    odom_topic: "/odin1/odometry_highfreq"
    chassis_data_topic: "/chassis_data"

    # 坐标系
    global_frame: "odom"
    robot_frame: "vehicle"

    # 频率
    command_rate_hz: 10.0
    status_rate_hz: 1.0

    # 姿态取值（1=得分姿态，2 与其等价、统一用 1；3=移动姿态；官方已确认）
    posture_score: 1
    posture_move: 3

    # 待机指令（P2 时间窗调度实装前的默认输出）
    standby_posture: 3
    standby_nav_mode: 0
    standby_task_id: 0
