# 路径图（导航用）：现场用 tools/mark_points.py 打点生成，也可以手改。
#
# 规划方式（2.md P3.3）：车 -> 最近节点 -> Dijkstra(逐边做可通行校验) -> 接入节点 -> 目标，
#   「节点 -> 目标」与「车 -> 节点」两段都要满足 path_margin 的直线可通行校验；
#   无解时若直线可通行则退化为直线，否则停车（不乱走）。
#
# 打点建议：沿实际可跑路线每隔 2~3 m 放一个节点，路口/坡道出入口各放一个；
#   补给区 -> 拉出点、补给区 -> 中央高地（经起伏路段）、补给区 -> 梯形高地（经基地斜坡）、
#   补给区 -> 地堡（经公路区）四条路线各至少一条链，节点数 15~30 个足够。
#
# nodes:  name 唯一；x/y 为 odom 系 m
# edges:  无向边，写节点名
# spin_forbidden_zones: 禁小陀螺区（斜坡/起伏路段），轴对齐矩形；
#   车体在该区内时导航会忽略决策下发的小陀螺转速（避免斜坡上超功率）
nodes: []
edges: []
spin_forbidden_zones: []
